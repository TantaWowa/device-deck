name: Mac distribution
on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish free installers to GitHub Releases
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: mac-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.17.0
          package-manager-cache: false
      - run: brew install ffmpeg-full
      - run: echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:distribution
      - run: npm run package:mac
      - name: Prove staged application lifecycle
        run: npm run proof:mac -- --app "work/distribution/staging/${{ matrix.architecture }}/payload/Applications/Device Deck.app"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: device-deck-${{ matrix.architecture }}
          path: |
            work/distribution/*.pkg
            work/distribution/*.sha256
            work/distribution/*.json
          if-no-files-found: error
  publish:
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: device-deck-*
          merge-multiple: true
          path: installers
      - name: Publish free installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          flags=()
          [[ "$version" != *-* ]] || flags+=(--prerelease)
          gh release create "v$version" installers/* --target "$GITHUB_SHA" --title "Device Deck $version" --notes "Free and open source under MIT. All features included. These installers are unsigned with ad-hoc app signatures. See the README for source builds and platform dependencies." "${flags[@]}"
