name: device-deck-billing
services:
  billing:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file: .env
    volumes:
      - billing-data:/data
      - ./billing.json:/config/billing.json:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 90s
    ports:
      - "127.0.0.1:8080:8080"
  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    environment:
      BILLING_DOMAIN: ${BILLING_DOMAIN:?Set a public billing hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      billing:
        condition: service_healthy
volumes:
  billing-data:
  caddy-data:
  caddy-config:
